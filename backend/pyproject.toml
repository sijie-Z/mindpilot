[project]
name = "mindpilot"
version = "1.0.0"
description = "Multi-modal intelligent knowledge retrieval and multi-platform collaboration system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MindPilot Team"}
]
keywords = ["rag", "llm", "knowledge-retrieval", "langgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=50"
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/__pycache__/*",
    "app/tests/*",
    "*/migrations/*",
    # API handlers require running application
    "app/api/*",
    # Requires live services or external models
    "app/multimodal/*",
    "app/rag/faiss_store.py",
    "app/rag/vector_store.py",
    "app/rag/reranker.py",
    "app/rag/consistency.py",
    "app/storage/session_repo.py",
    "app/agents/workflow.py",
    "app/agents/retrieval_agent.py",
    "app/agents/self_rag.py",
    # Infrastructure entry points
    "app/main.py",
    "app/core/container.py",
    "app/core/observability.py",
    "app/core/metrics.py",
    "app/core/rate_limit.py",
    "app/utils/mcp.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod"
]
show_missing = true
skip_covered = false

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "migrations",
    "alembic",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "N818", # Exception name should end with Error
    "B008", # Function calls in default args
    "UP042", # str + Enum inheritance is intentional for ErrorCode pattern
    "N802", # Uppercase property names (MYSQL_URL, REDIS_URL) are intentional
    "B904", # raise ... from err is not required in all cases
    "SIM108", # ternary operator preference, not a bug
    "SIM102", # nested if preference, not a bug
    "SIM117", # nested with statements are fine in tests
    "SIM105", # try-except-pass is clearer than suppress in tests
    "E722",   # bare except is intentional in error handling tests
    "B017",   # pytest.raises(Exception) is intentional for security tests
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pymilvus.*",
    "faiss.*",
    "zhipuai.*",
    "langgraph.*",
    "langchain_core.*"
]
ignore_missing_imports = true